[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cognis-bastionkit"
version = "0.1.1"
description = "Hardened security baseline for air-gapped/regulated Kubernetes — assess + generate NetworkPolicy/PodSecurity/RBAC/quota controls"
authors = [{name = "Cognis Digital", email = "suite@cognis.digital"}]
license = {text = "LicenseRef-COCL-1.0"}
requires-python = ">=3.10"
readme = "README.md"
keywords = ["kubernetes", "hardening", "devsecops", "compliance", "cli",
            "self-hosted", "cognis-neural-suite", "air-gapped", "security"]
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: Other/Proprietary License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: System :: Systems Administration",
]
dependencies = []

[project.optional-dependencies]
connect = ["cognis-connect @ git+https://github.com/cognis-digital/cognis-connect.git"]
dev = ["pytest>=8.0"]

[project.urls]
Homepage = "https://cognis.digital"
Repository = "https://github.com/cognis-digital/bastionkit"

[project.scripts]
"bastionkit-emit" = "bastionkit.connect:emit_main"
bastionkit = "bastionkit.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["bastionkit"]
