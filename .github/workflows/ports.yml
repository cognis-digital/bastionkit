name: ports
on: [push, pull_request]
permissions:
  contents: read
jobs:
  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Test (Node port)
        working-directory: ports/node
        run: node --test

  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.21"
      - name: Build + test (Go port)
        working-directory: ports/go
        run: |
          go vet ./...
          go build ./...
          go test ./...

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build + test (Rust port)
        working-directory: ports/rust
        run: |
          cargo build --release
          cargo test

  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test (Shell port)
        run: bash ports/shell/test.sh

  parity:
    runs-on: ubuntu-latest
    needs: [node, shell]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Cross-port output parity (Python == Node == Shell)
        shell: bash
        run: |
          python -m bastionkit generate --namespace prod > /tmp/py.yaml
          node ports/node/bastionkit.mjs generate --namespace prod > /tmp/node.yaml
          # Node port emits the full bundle; the Namespace + default-deny docs
          # must match the Python reference byte-for-byte.
          diff <(sed -n '1,21p' /tmp/py.yaml) <(sed -n '1,21p' /tmp/node.yaml)
          echo "Namespace + NetworkPolicy docs match across Python and Node ports."
